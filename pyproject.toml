[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "incident-response-agent"
version = "0.1.0"
description = "Adaptive multi-modal industrial incident-response agent (CSE3101)"
requires-python = ">=3.11,<3.12"

[tool.setuptools]
# Explicit list, not auto-discovery: keeps datasets/, notes/, and cache/ out.
packages = [
    "core", "core.llm", "schemas", "detectors", "harness",
    "memory", "agents", "agents.dispatch", "guardrails",
    "observability", "workflows", "eval", "mcp_server",
]
