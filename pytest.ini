[pytest]
testpaths = tests
asyncio_mode = auto

# Live-provider tests are deselected by default: one real qwen3:4b round trip
# takes ~82s on CPU. Run them with `pytest -m live` (and before any merge).
addopts = -m "not live"

markers =
    live: exercises a real LLM provider (Ollama or Gemini); slow, needs a service

filterwarnings =
    ignore::UserWarning:google.adk.*
